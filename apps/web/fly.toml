# Kobolink web — the ONLY public Fly app. Serves pay.folusayo.com: the screens,
# the server-rendered /l/[code] checkout, the /.well-known/* association route
# handlers, and a proxy of /api/* to the private api app (apps/api/fly.toml).
#
# Deploy from the REPO ROOT (the Docker build context is the monorepo):
#   fly deploy . --config apps/web/fly.toml --dockerfile apps/web/Dockerfile --remote-only
# Full first-time setup and the owner-only steps: docs/DEPLOY.md.
#
# No credentials live in this file. Secrets (APPLE_APP_ID,
# ANDROID_SHA256_FINGERPRINTS) are set with `fly secrets set`, never here.

# Fly app names are global. If "kobolink-web" is taken, pick another and use it
# everywhere docs/DEPLOY.md says kobolink-web.
app = "kobolink-web"
primary_region = "lhr" # nearest large region to Nigeria; keep the api in the same region.

# BUILD-TIME variables. Next freezes the /api/* rewrite destination and inlines
# NEXT_PUBLIC_* while `next build` runs, so these must be build args; the same
# values are repeated under [env] for the code that reads them at runtime
# (apps/web/src/lib/api.ts reads API_ORIGIN for server-side fetches).
[build.args]
  # The private api app over Fly's 6PN network (".internal" = no public
  # address, no extra IP to allocate). Port is the api's PORT (3001). If you
  # rename the api app, change it here AND in [env] below.
  API_ORIGIN = "http://kobolink-api.internal:3001"
  # Keep this under 30000. Next's /api/* proxy drops a proxied connection that
  # has been idle for 30s, so the dashboard SSE stream must send its keepalive
  # `heartbeat` event more often than that. It must equal the api's
  # DASHBOARD_HEARTBEAT_MS (apps/api/fly.toml): the browser treats 2.5x this
  # much silence as a dead stream and reconnects.
  NEXT_PUBLIC_DASHBOARD_HEARTBEAT_MS = "15000"
  # NEXT_PUBLIC_IOS_APP_STORE_ID: add it here once the app has an App Store id
  # (the iOS Smart App Banner on /l/[code]). Unset, the tag is simply omitted.

[env]
  API_ORIGIN = "http://kobolink-api.internal:3001"
  NEXT_PUBLIC_LINK_DOMAIN = "pay.folusayo.com"
  # Must equal the package in packages/contracts; the assetlinks handler 503s
  # on anything else. The fingerprints are a secret-managed value (see above).
  ANDROID_PACKAGE_NAME = "com.folusayo.kobolink"

[http_service]
  internal_port = 3000
  force_https = true
  # Always keep one machine running. Apple's CDN fetches the AASA with a short
  # timeout; a machine that has to cold-start can make it give up, and a
  # failed fetch is cached against you. A stopped machine is a risk, not a saving.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
